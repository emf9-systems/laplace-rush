<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Estudia el Certamen 2 de Automatización y Control: repaso por tema, tests, simulacro y ranking.">
<title>Laplace Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app de una pantalla tipo reels — HUD fijo arriba, vista central desplazable, barra de pestañas abajo. Estética "plano s de noche": tinta violeta profunda, señal coral, monedas doradas. */
:root{
  --ink:#130f24; --panel:#1e1838; --panel2:#2a2250; --line:#3b3268;
  --fg:#f1edff; --muted:#a89fcf; --signal:#ff6b4a; --signal2:#ff9b54;
  --gold:#ffd166; --xp:#9b8cff; --ok:#3ddc97; --bad:#ff4f6d;
  --r-comun:#9aa3b8; --r-rara:#4cc9f0; --r-epica:#b06cff; --r-leg:#ffb703; --r-mit:#ff4fd8;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --hud-h:58px; --nav-h:62px;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:var(--signal2)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.mono{font-family:var(--f-mono)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* HUD */
#hud{height:var(--hud-h);display:flex;align-items:center;gap:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,var(--ink),rgba(19,15,36,.85));border-bottom:1px solid var(--line);flex:none;z-index:5}
.lvl{position:relative;width:40px;height:40px;flex:none}
.lvl svg{position:absolute;inset:0}
.lvl b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:14px}
.xpwrap{flex:1;min-width:0}
.xpbar{height:8px;border-radius:8px;background:var(--panel2);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--xp),var(--r-mit));width:0;transition:width .6s cubic-bezier(.2,1.4,.4,1)}
.xplabel{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;white-space:nowrap;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.chip svg{width:16px;height:16px}
.chip.gold{color:var(--gold)} .chip.fire{color:var(--signal2)}
.bump{animation:bump .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
/* main */
#main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 28px}
.view[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
/* nav */
#nav{height:var(--nav-h);flex:none;display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);background:var(--ink);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;min-width:0;overflow:hidden;color:var(--muted);letter-spacing:.02em;position:relative}
#nav button svg{width:22px;height:22px}
#nav button[aria-current="true"]{color:var(--fg)}
#nav button[aria-current="true"]::after{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--signal)}
.dot{position:absolute;top:8px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 2px var(--ink)}
/* reels */
#v-feed{padding:0;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain}
.reel{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;justify-content:center;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:20px 24px;overflow:hidden}
.reel .inner{max-width:620px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
.reel .bgfx{position:absolute;inset:0;z-index:0;opacity:.55;pointer-events:none}
.tag{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:6px;background:var(--panel2);color:var(--muted)}
.tag.hot{background:var(--signal);color:var(--ink)}
.tag.gold{background:var(--gold);color:var(--ink)}
.reel h2{font-size:clamp(22px,5.5vw,34px)}
.big{font-size:clamp(18px,4.6vw,24px);overflow-x:auto;overflow-y:hidden;padding:4px 0}
.opts{display:grid;gap:10px}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:14px;background:var(--panel);border:1.5px solid var(--line);font-size:16px;transition:transform .12s, background .2s, border-color .2s;overflow-x:auto}
.opt:hover{border-color:var(--xp)} .opt:active{transform:scale(.98)}
.opt.ok{background:color-mix(in srgb,var(--ok) 22%,var(--panel));border-color:var(--ok)}
.opt.no{background:color-mix(in srgb,var(--bad) 22%,var(--panel));border-color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.swipehint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);z-index:1;animation:float 2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px)}}
.side{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:70px;z-index:2;display:flex;flex-direction:column;gap:14px;align-items:center}
.side button{width:46px;height:46px;border-radius:50%;background:rgba(30,24,56,.8);border:1px solid var(--line);display:grid;place-items:center}
.side button svg{width:22px;height:22px}
.side button.on{color:var(--signal)}
.side small{font-size:10px;color:var(--muted);margin-top:-10px}
/* surfaces */
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.card.flat{background:transparent;border-style:dashed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:700;background:var(--panel2);border:1px solid var(--line);transition:transform .1s, filter .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--signal),var(--signal2));color:#1a0d08;border:0}
.btn.gold{background:var(--gold);color:#2a1d00;border:0}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
input.ans,input.txt{width:100%;font-family:var(--f-mono);font-size:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--ink);color:var(--fg)}
input.ans.ok{border-color:var(--ok)} input.ans.no{border-color:var(--bad);animation:shake .35s}
.preview{font-size:14px;color:var(--muted);min-height:24px;overflow-x:auto}
.muted{color:var(--muted)} .small{font-size:13px}
.ok-t{color:var(--ok)} .bad-t{color:var(--bad)} .gold-t{color:var(--gold)}
.steps{display:flex;flex-direction:column;gap:14px}
.step{border-left:3px solid var(--line);padding-left:14px;display:flex;flex-direction:column;gap:8px}
.step.done{border-color:var(--ok)}
.step .lab{font-weight:700}
.sol{background:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;overflow-x:auto}
.sol ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px}
.mathbox{overflow-x:auto;overflow-y:hidden;max-width:100%}
mjx-container{max-width:100%}
mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;margin:.4em 0!important}
/* learn */
.lesson h3{font-size:18px;margin-top:6px}
.lesson p,.lesson li{max-width:68ch}
.method{counter-reset:m;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.method li{counter-increment:m;position:relative;padding-left:40px}
.method li::before{content:counter(m);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-display);font-size:13px;background:var(--signal);color:var(--ink)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;min-width:420px}
.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
.tbl th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.mod{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.mod .n{font-family:var(--f-display);font-size:12px;color:var(--signal2)}
.mod b{font-family:var(--f-display);font-size:16px;line-height:1.2}
.mod .done{font-size:12px;color:var(--ok)}
.meter{height:6px;border-radius:6px;background:var(--panel2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
/* practice list */
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.type{display:flex;flex-direction:column;gap:8px;text-align:left;padding:16px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.type b{font-family:var(--f-display);font-size:15px}
.diff{font-size:12px;color:var(--gold)}
/* collection */
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.tcard{aspect-ratio:5/7;max-width:100%;border-radius:12px;position:relative;overflow:hidden;background:var(--panel2);border:2px solid var(--rc,var(--line));display:flex;flex-direction:column;text-align:left;padding:0}
.tcard .art{flex:1;min-height:0;background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--rc) 35%,transparent),transparent 70%),var(--ink)}
.tcard .art svg{width:100%;height:100%;display:block}
.tcard .nm{font-size:11px;font-weight:700;line-height:1.15;padding:6px 7px 2px}
.tcard .rr{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--rc);padding:0 7px 6px}
.tcard .cnt{position:absolute;top:5px;right:5px;font-size:11px;font-weight:700;background:var(--ink);border-radius:8px;padding:1px 6px}
.tcard.locked{filter:grayscale(1) brightness(.35)}
.tcard.locked .nm{visibility:hidden}
.tcard.shine::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%);animation:shine 2.6s infinite}
@keyframes shine{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pack{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;padding:16px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.pack .pk{width:74px;height:100px;border-radius:12px;position:relative;box-shadow:0 10px 30px -10px var(--pc)}
.pack .pk svg{width:100%;height:100%}
.odds{font-size:12px;color:var(--muted)}
/* overlay */
#ov{position:fixed;inset:0;z-index:50;background:rgba(9,6,20,.92);display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));overflow:auto}
#ov .box{max-width:560px;width:100%;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.reveal{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;perspective:900px}
.flip{width:118px;aspect-ratio:5/7;max-width:28vw;position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.4,.5,1);cursor:pointer}
.flip.open{transform:rotateY(180deg)}
.flip>*{position:absolute;inset:0;backface-visibility:hidden}
.flip .back{border-radius:12px;background:repeating-linear-gradient(45deg,var(--panel2) 0 8px,var(--panel) 8px 16px);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:28px;color:var(--muted)}
.flip .front{transform:rotateY(180deg)}
.flip .front .tcard{width:100%;height:100%}
.flip.r-leg .front .tcard,.flip.r-mit .front .tcard{box-shadow:0 0 30px 4px var(--rc)}
.packbig{width:160px;height:216px;cursor:pointer;animation:wobble 1.2s ease-in-out infinite}
.packbig.tear{animation:tear .7s forwards}
@keyframes wobble{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) scale(1.03)}}
@keyframes tear{30%{transform:scale(1.15) rotate(-6deg)}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(0);opacity:0}}
/* toasts */
#toasts{position:fixed;top:calc(var(--hud-h) + 8px + env(safe-area-inset-top,0px));left:0;right:0;z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{pointer-events:auto;max-width:440px;width:100%;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);box-shadow:0 12px 30px -12px #000;animation:tin .4s cubic-bezier(.2,1.5,.4,1)}
.toast .ic{width:38px;height:38px;flex:none;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-size:13px;background:var(--gold);color:var(--ink)}
.toast.toast-ach .ic{background:var(--r-mit)}
@keyframes tin{from{transform:translateY(-20px) scale(.9);opacity:0}}
.float{position:fixed;z-index:70;pointer-events:none;font-family:var(--f-display);font-weight:900;font-size:20px;animation:up 1.1s forwards;text-shadow:0 2px 10px #000}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80}
.combo{font-family:var(--f-display);font-size:13px;color:var(--signal2)}
.crit{font-family:var(--f-display);font-size:clamp(28px,8vw,48px);color:var(--gold);animation:crit .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes crit{from{transform:scale(.2) rotate(-12deg);opacity:0}}
/* ranking */
.rank{display:flex;flex-direction:column;gap:6px}
.rk{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.rk.me{border-color:var(--signal)}
.rk .pos{font-family:var(--f-display);font-size:15px;text-align:center}
.rk .pos.p1{color:var(--r-leg)} .rk .pos.p2{color:#cfd6e6} .rk .pos.p3{color:#d08b5b}
.rk .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.rk .sub{font-size:12px;color:var(--muted);font-weight:400}
.rk .xp{font-variant-numeric:tabular-nums;font-weight:700;color:var(--xp)}
.banner{padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-size:14px}
.banner.ok{border-color:var(--ok)} .banner.warn{border-color:var(--gold)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ach{padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.ach.off{opacity:.42}
.ach b{font-size:14px}
.ach span{font-size:12px;color:var(--muted)}
.tracks{display:flex;flex-direction:column;gap:8px}
.track{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.track .cv{width:44px;height:44px;border-radius:10px}
.track.playing{border-color:var(--signal)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.stat{padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.mission{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.wheel{width:220px;height:220px;max-width:70vw;max-height:70vw;transition:transform 4s cubic-bezier(.15,.9,.2,1)}
.timer{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:99px;border:1px solid var(--line);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
svg.plot{width:100%;height:auto;max-height:220px;background:var(--ink);border-radius:12px;border:1px solid var(--line)}
/* Monas */
.reel .monabg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.2;z-index:0;pointer-events:none;filter:saturate(1.4);-webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.55) 55%,transparent 100%);mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.55) 55%,transparent 100%)}
.tcard .art img{transition:transform .3s}
.tcard.locked .art img{filter:blur(7px)}
.tease{position:relative;align-self:center;width:min(240px,62vw);aspect-ratio:5/7;border-radius:16px;overflow:hidden;border:3px solid var(--rc);box-shadow:0 0 50px -8px var(--rc)}
.tease img{width:100%;height:100%;object-fit:cover;filter:blur(12px) brightness(.55) saturate(1.6);transform:scale(1.15)}
.tease span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:72px;font-weight:900;color:var(--rc);text-shadow:0 0 24px var(--rc);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
#mreact{position:fixed;right:12px;bottom:calc(var(--nav-h) + 14px);z-index:80;width:132px;pointer-events:none;transform:translateY(30px) scale(.4) rotate(-8deg);opacity:0;transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .2s}
#mreact.on{opacity:1;transform:none}
#mreact img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px;border:3px solid var(--good,#3ddc97);box-shadow:0 10px 30px -6px rgba(0,0,0,.6);display:block;background:var(--ink)}
#mreact.bad img{border-color:var(--signal)}
#mreact b{position:absolute;left:50%;top:-14px;transform:translateX(-50%) rotate(-4deg);white-space:nowrap;font-family:var(--f-display);font-size:14px;background:var(--gold);color:var(--ink);padding:3px 10px;border-radius:999px}
#mreact.bad b{background:var(--signal);color:#fff}
.splash{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(circle,color-mix(in srgb,var(--rc) 45%,transparent),rgba(10,8,20,.94) 70%);animation:spIn .35s ease-out;cursor:pointer;overflow:hidden}
.splash .rays{position:absolute;width:220vmax;height:220vmax;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--rc) 40%,transparent) 0 8deg,transparent 8deg 20deg);animation:spin 9s linear infinite;opacity:.6}
.splash img{position:relative;max-width:min(78vw,420px);max-height:56vh;border-radius:18px;border:4px solid var(--rc);box-shadow:0 0 80px 10px var(--rc);animation:spPop .6s cubic-bezier(.3,1.6,.5,1)}

<script>
// ===== Corrector flexible de respuestas =====
const Checker = (() => {
  function normalize(raw, v) {
    let x = String(raw || '').trim().toLowerCase();
    if (!x) return '';
    x = x.replace(/[−–—]/g, '-').replace(/[×·•∙⋅]/g, '*').replace(/÷/g, '/')

    x = x.replace(/\*?\s*(μ|mu|u)\s*\(\s*t\s*\)/g, '');
    x = x.replace(/\bsen\b|sen(?=\s*\()/g, 'sin').replace(/\bln\b/g, 'log').replace(/\btg\b/g, 'tan');

    x = x.replace(/(\d),(\d)/g, '$1.$2');
    x = x.replace(/%/g, '');
    x = x.replace(/sqrt\s*([\d.]+|[a-z])(?![\w(])/g, 'sqrt($1)');

    x = x.replace(/exp/g, '\u0001').replace(/x/g, '*').replace(/\u0001/g, 'exp');

// ===== Utilidades matemáticas =====
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

const T = (x) => '\\(' + fixC(x) + '\\)';
const D = (x) => '\\[' + fixC(x) + '\\]';

// ===== Generadores de ejercicios =====
const TYPES = [

  if (Math.abs(xi - 1) < 1e-6) return (t) => K * (1 - Math.exp(-wn * t) * (1 + wn * t));
  const r1 = -sg + wn * Math.sqrt(xi * xi - 1), r2 = -sg - wn * Math.sqrt(xi * xi - 1);
  return (t) => K * (1 + (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r1 - r2));
}

{ id:'elem', n:'Módulo 1', title:'Señales elementales y tabla', short:'μ(t), δ(t), r(t), seno, exponencial y la tabla de conversión del curso.', practice:'lap', html: String.raw`
<p>Para analizar un sistema le aplicamos una <b>señal de prueba</b> en la entrada y miramos cómo responde la salida. En el curso usamos estas:</p>
<div class="tbl"><table><thead><tr><th>Señal</th><th>Símbolo</th><th>Qué representa</th><th>Laplace</th></tr></thead><tbody>
<tr><td>Escalón unitario</td><td>\(\mu(t)\)</td><td>Cambio instantáneo de 0 a 1 (cerrar un interruptor de una fuente continua). \(f(0^-)=0,\ f(0^+)=1\).</td><td>\(\dfrac{1}{s}\)</td></tr>
<tr><td>Impulso unitario</td><td>\(\delta(t)\)</td><td>Delta de Dirac, derivada del escalón (martillazo en un clavo).</td><td>\(1\)</td></tr>
<tr><td>Rampa unitaria</td><td>\(r(t)=t\,\mu(t)\)</td><td>Crece con pendiente 1 por unidad de tiempo.</td><td>\(\dfrac{1}{s^2}\)</td></tr>
</tbody></table></div>
<h3>Tabla de conversión (la que viene en el certamen)</h3>
<div class="tbl"><table><thead><tr><th>Temporal \(f(t)\)</th><th>Laplace \(F(s)\)</th></tr></thead><tbody>
<tr><td>\(e^{-at}\)</td><td>\(\dfrac{1}{s+a}\)</td></tr>
<tr><td>\(a\,\mu(t)\)</td><td>\(\dfrac{a}{s}\)</td></tr>
<tr><td>\(a\sin(\omega t)\)</td><td>\(a\dfrac{\omega}{s^2+\omega^2}\)</td></tr>
<tr><td>\(a\cos(\omega t)\)</td><td>\(a\dfrac{s}{s^2+\omega^2}\)</td></tr>
<tr><td>\(b\,e^{-at}\sin(\omega t)\)</td><td>\(b\dfrac{\omega}{(s+a)^2+\omega^2}\)</td></tr>
<tr><td>\(b\,e^{-at}\cos(\omega t)\)</td><td>\(b\dfrac{s+a}{(s+a)^2+\omega^2}\)</td></tr>
<tr><td>\(t\,e^{-at}\)</td><td>\(\dfrac{1}{(s+a)^2}\)</td></tr>
<tr><td>\(t^n\)</td><td>\(\dfrac{n!}{s^{n+1}}\)</td></tr>
</tbody></table></div>
<p class="muted small">Ojo con el signo: un polo en \(s=-a\) da \(e^{-at}\) (se apaga). Un polo en \(s=+a\), o sea \(\frac{1}{s-a}\), da \(e^{+at}\) (crece, sistema inestable).</p>
<h3>Señales desplazadas</h3>
<p>Una señal que empieza en \(t=a\) se escribe \(\mu(t-a)\) o \(r(t-a)\). Con el segundo teorema de traslación, cada retardo multiplica por \(e^{-as}\):</p>
\[\mathcal{L}\{\mu(t-a)\}=\frac{e^{-as}}{s}\qquad \mathcal{L}\{r(t-a)\}=\frac{e^{-as}}{s^2}\]
<p>Así, una señal "con forma" se arma sumando escalones y rampas desplazadas, por ejemplo \(F(t)=\mu(t-2)+2r(t-4)-6r(t-5)+\dots\)</p>`},
{ id:'lap', n:'Módulo 2', title:'Transformada de Laplace', short:'Definición, propiedades y cómo pasar de una ecuación diferencial a la función de transferencia.', practice:'lap', html: String.raw`
<p>La transformada de Laplace convierte una <b>ecuación diferencial</b> en el tiempo en una <b>ecuación algebraica</b> en la variable compleja \(s\). Así derivar pasa a ser multiplicar por \(s\), e integrar pasa a ser dividir por \(s\).</p>
\[F(s)=\mathcal{L}\{f(t)\}=\int_0^{\infty} f(t)\,e^{-st}\,dt\]
<h3>Propiedades que más se usan</h3>
<div class="tbl"><table><thead><tr><th>Propiedad</th><th>Fórmula</th></tr></thead><tbody>
<tr><td>Linealidad</td><td>\(\mathcal{L}\{a f(t)+b g(t)\}=aF(s)+bG(s)\)</td></tr>
<tr><td>Derivada</td><td>\(\mathcal{L}\{f'(t)\}=sF(s)-f(0)\)</td></tr>
<tr><td>Segunda derivada</td><td>\(\mathcal{L}\{f''(t)\}=s^2F(s)-s f(0)-f'(0)\)</td></tr>
<tr><td>Integral</td><td>\(\mathcal{L}\{\int_0^t f\,d\tau\}=\dfrac{F(s)}{s}\)</td></tr>
<tr><td>Traslación 1 (en \(s\))</td><td>\(\mathcal{L}\{e^{kt}f(t)\}=F(s-k)\)</td></tr>
<tr><td>Traslación 2 (en \(t\))</td><td>\(\mathcal{L}\{f(t-a)\mu(t-a)\}=e^{-as}F(s)\)</td></tr>
<tr><td>Valor final</td><td>\(\lim_{t\to\infty}f(t)=\lim_{s\to0}sF(s)\)</td></tr>
<tr><td>Valor inicial</td><td>\(f(0^+)=\lim_{s\to\infty}sF(s)\)</td></tr>
</tbody></table></div>
<h3>Paso a paso: transformar una \(f(t)\)</h3>
<ol class="method">
<li><b>Separa por sumas</b> (linealidad). Cada término se transforma por separado y las constantes salen afuera.</li>
<li><b>Reconoce la fila de la tabla</b> de cada término: ¿es exponencial, seno, coseno, seno amortiguado, \(t\,e^{-at}\)?</li>
<li><b>Identifica \(a\) y \(\omega\)</b>. En \(e^{-3t}\cos(2t)\): \(a=3\), \(\omega=2\).</li>
<li><b>Si hay una exponencial multiplicando</b>, transforma lo de adentro y reemplaza \(s\to s+a\) (traslación 1).</li>
<li><b>Suma los resultados.</b> Puedes dejarlo como suma de fracciones; no hace falta juntar.</li>
</ol>
<div class="sol"><b>Ejemplo</b>
\[f(t)=4-3e^{-2t}+5\sin(3t)\ \Rightarrow\ F(s)=\frac{4}{s}-\frac{3}{s+2}+\frac{15}{s^2+9}\]</div>
<h3>Paso a paso: de ecuación diferencial a función de transferencia</h3>
<ol class="method">
<li>Aplica Laplace a cada ecuación con <b>condiciones iniciales cero</b>: \(\frac{dx}{dt}\to sX(s)\), \(\frac{d^2x}{dt^2}\to s^2X(s)\).</li>
<li>Agrupa cada variable: por ejemplo \((m_1s^2+k_1)X_1(s)-k_1X_2(s)=F(s)\).</li>
<li>Despeja las variables intermedias (\(X_1\)) en función de la salida (\(X_2\)).</li>
<li>Reemplaza en la otra ecuación y arma el cociente <b>salida / entrada</b>: \(G(s)=\dfrac{X_2(s)}{F(s)}\).</li>
</ol>
<div class="sol"><b>Ejemplo del certamen (dos masas y dos resortes)</b>
\[f=m_1\ddot x_1+k_1(x_1-x_2),\qquad k_1(x_1-x_2)=m_2\ddot x_2+k_2x_2\]
<p>De la 2ª: \(X_1=\dfrac{(m_2s^2+k_1+k_2)}{k_1}X_2\). Reemplazando en la 1ª:</p>
\[\frac{X_2(s)}{F(s)}=\frac{k_1}{(m_1s^2+k_1)(m_2s^2+k_1+k_2)-k_1^2}\]</div>`},
{ id:'pf', n:'Módulo 3', title:'Fracciones parciales', short:'Los 3 casos de denominador, el método de "tapar" (residuos) y cómo resolver coeficientes.', practice:'pf1', html: String.raw`
<p>Para invertir una \(F(s)\) complicada la <b>descomponemos en una suma de fracciones simples</b> que sí están en la tabla. Esto se llama descomposición en fracciones parciales.</p>
<h3>Antes de empezar: ¿propia o impropia?</h3>
<p>Una fracción \(\frac{P(s)}{Q(s)}\) es <b>propia</b> si el grado de \(P\) es menor que el de \(Q\). Si es <b>impropia</b> (grado de \(P\ge\) grado de \(Q\)), primero divide los polinomios: queda un polinomio más una fracción propia.</p>
<h3>Caso 1: factores lineales distintos</h3>
\[\frac{P(s)}{(s-p_1)(s-p_2)\cdots}=\frac{A}{s-p_1}+\frac{B}{s-p_2}+\cdots\]
<p><b>Método de tapar (residuos):</b> para hallar \(A\), multiplica todo por \((s-p_1)\) y evalúa en \(s=p_1\):</p>
\[A=\Big[(s-p_1)F(s)\Big]_{s=p_1}\]
<div class="sol"><b>Ejemplo</b>
\[\frac{7s+3}{s^2+3s-4}=\frac{7s+3}{(s+4)(s-1)}=\frac{A}{s+4}+\frac{B}{s-1}\]
<p>\(A=\left.\frac{7s+3}{s-1}\right|_{s=-4}=\frac{-25}{-5}=5\), &nbsp; \(B=\left.\frac{7s+3}{s+4}\right|_{s=1}=\frac{10}{5}=2\)</p></div>
<h3>Caso 2: factores lineales repetidos</h3>
<p>Un factor \((s-p)^k\) aporta \(k\) términos:</p>
\[\frac{A_1}{s-p}+\frac{A_2}{(s-p)^2}+\cdots+\frac{A_k}{(s-p)^k}\]
<p>El de mayor potencia sale tapando: \(A_k=[(s-p)^kF(s)]_{s=p}\). Los otros salen <b>igualando coeficientes</b> (o derivando).</p>
<div class="sol"><b>Ejemplo</b>
\[\frac{5s^2-36s+48}{s(s-4)^2}=\frac{A}{s}+\frac{B}{s-4}+\frac{C}{(s-4)^2}\]
<p>Tapando: \(A=\frac{48}{16}=3\), \(C=\frac{80-144+48}{4}=-4\). Coeficiente de \(s^2\): \(A+B=5\Rightarrow B=2\).</p></div>
<h3>Caso 3: factor cuadrático irreducible (raíces complejas)</h3>
<p>Si \(s^2+bs+c\) tiene discriminante \(b^2-4c<0\), no se separa. Se deja un término \(\frac{Bs+C}{s^2+bs+c}\) y se <b>completa el cuadrado</b>:</p>
\[s^2+bs+c=(s+\sigma)^2+\omega^2,\qquad \sigma=\frac{b}{2},\quad \omega=\sqrt{c-\sigma^2}\]
<p>Luego se reescribe el numerador como \(B(s+\sigma)+K\omega\) para que calce con las filas de coseno y seno amortiguado.</p>
<h3>Paso a paso general</h3>
<ol class="method">
<li>Revisa si es propia. Si no, divide.</li>
<li><b>Factoriza el denominador</b>: encuentra sus raíces (fórmula cuadrática: \(s=\frac{-b\pm\sqrt{b^2-4ac}}{2a}\)).</li>
<li>Clasifica cada factor: lineal distinto, lineal repetido o cuadrático complejo.</li>
<li>Escribe la forma de la descomposición con constantes \(A, B, C\dots\)</li>
<li>Calcula las constantes: tapar para lineales; igualar coeficientes para el resto.</li>
<li><b>Verifica</b> evaluando ambos lados en un número cualquiera, como \(s=1\).</li>
</ol>`},
{ id:'inv', n:'Módulo 4', title:'Transformada inversa y respuesta al escalón', short:'El método completo del certamen: multiplicar por 1/s, fracciones parciales, tabla. Los 4 tipos de raíces.', practice:'esc', html: String.raw`
<p>La forma más fácil de obtener la función en el tiempo es <b>descomponer \(F(s)\) en una suma de funciones sencillas</b> y transformar cada término con la tabla.</p>
<h3>Respuesta a un escalón unitario: el ejercicio estrella</h3>
<p>Si la entrada es \(\mu(t)\), entonces \(R(s)=\frac{1}{s}\) y la salida es</p>
\[C(s)=G(s)\cdot\frac{1}{s}\qquad\Rightarrow\qquad c(t)=\mathcal{L}^{-1}\{C(s)\}\]
<ol class="method">
<li><b>Arma \(C(s)=G(s)/s\)</b>. Si la entrada es un escalón de valor 10, usa \(10/s\).</li>
<li><b>Junta todo en una sola fracción</b> si \(G\) viene como suma (como \(G_1\), \(G_5\), \(G_6\) de la guía).</li>
<li><b>Factoriza el denominador</b> y encuentra los polos (raíces).</li>
<li><b>Descompón en fracciones parciales</b> según el caso de cada raíz.</li>
<li><b>Aplica la tabla</b> término a término.</li>
<li><b>Comprueba</b>: \(c(0)\) debería ser 0 en sistemas físicos estrictamente propios, y el valor final es \(\lim_{s\to0} sC(s)=G(0)\) si el sistema es estable.</li>
</ol>
<h3>Los 4 tipos de raíces y su forma en el tiempo</h3>
<div class="tbl"><table><thead><tr><th>Raíces del denominador</th><th>Término en \(s\)</th><th>Forma en \(t\)</th></tr></thead><tbody>
<tr><td>Reales distintas</td><td>\(\frac{A}{s+a}+\frac{B}{s+b}\)</td><td>\(Ae^{-at}+Be^{-bt}\) (sin oscilación)</td></tr>
<tr><td>Reales iguales</td><td>\(\frac{A}{s+a}+\frac{B}{(s+a)^2}\)</td><td>\(Ae^{-at}+B\,t\,e^{-at}\)</td></tr>
<tr><td>Complejas conjugadas \(-\sigma\pm j\omega\)</td><td>\(\frac{B(s+\sigma)+K\omega}{(s+\sigma)^2+\omega^2}\)</td><td>\(e^{-\sigma t}\big(B\cos\omega t+K\sin\omega t\big)\) (oscila y se apaga)</td></tr>
<tr><td>Imaginarias puras \(\pm j\omega\)</td><td>\(\frac{Bs+K\omega}{s^2+\omega^2}\)</td><td>\(B\cos\omega t+K\sin\omega t\) (oscila para siempre)</td></tr>
</tbody></table></div>
<div class="sol"><b>Ejemplo resuelto (G7 de la guía)</b>
\[C(s)=\frac{s+3}{s(s^2+6s+13)}=\frac{A}{s}+\frac{Bs+C}{s^2+6s+13}\]
<p>Tapando: \(A=\frac{3}{13}\). Igualando coeficientes: \(B=-\frac{3}{13}\), \(C=-\frac{5}{13}\). Completando el cuadrado, \(s^2+6s+13=(s+3)^2+2^2\), y el numerador queda \(-\frac{3}{13}(s+3)+\frac{2}{13}\cdot 2\):</p>
\[c(t)=\frac{3}{13}-\frac{3}{13}e^{-3t}\cos(2t)+\frac{2}{13}e^{-3t}\sin(2t)\]</div>
<p class="muted small">Atajo de ω: si tienes \(\frac{6}{s^2+9}\), escribe \(2\cdot\frac{3}{s^2+9}\), que da \(2\sin(3t)\). El numerador del seno siempre tiene que ser \(\omega\).</p>`},
{ id:'lc', n:'Módulo 5', title:'Lazo cerrado y diagrama de bloques', short:'Controlador, planta y medición: cómo armar T(s) = CF / (1 + CFH) y su respuesta.', practice:'lc', html: String.raw`
<p>Un lazo cerrado compara la referencia \(R(s)\) con la salida medida y corrige el error:</p>
<div class="mathbox" data-diagram="lc"></div>
<p>\(C(s)\): controlador. \(F(s)\): planta. \(H(s)\): etapa de medición (sensor). El <b>error</b> es \(E=R-HY\).</p>
\[T(s)=\frac{Y(s)}{R(s)}=\frac{C(s)F(s)}{1+C(s)F(s)H(s)}\]
<h3>Paso a paso</h3>
<ol class="method">
<li><b>Dibuja el diagrama</b>: \(R\to\) sumador \((+,-)\to C\to F\to Y\), y la realimentación \(Y\to H\to\) al signo menos.</li>
<li><b>Multiplica la rama directa</b>: \(G_d=C\cdot F\).</li>
<li><b>Aplica la fórmula</b> \(T=\frac{G_d}{1+G_dH}\).</li>
<li><b>Simplifica a una sola fracción</b>: multiplica arriba y abajo por los denominadores. Con \(C=\frac{K_c}{s+a}\) y \(F=\frac{K_p}{s+b}\):
\[T(s)=\frac{K_cK_p}{(s+a)(s+b)+K_cK_pH}\]</li>
<li><b>Respuesta al escalón</b>: \(Y(s)=T(s)\cdot\frac1s\), y sigue el método del módulo 4.</li>
<li><b>Valor final</b>: \(y(\infty)=T(0)\) para escalón unitario.</li>
</ol>
<div class="sol"><b>Ejemplo del certamen</b>
<p>Controlador proporcional \(0.5\), planta \(F(s)=\frac{1}{9s^2+3s+0.5}\), medición 1:</p>
\[T(s)=\frac{0.5\cdot\frac{1}{9s^2+3s+0.5}}{1+\frac{0.5}{9s^2+3s+0.5}}=\frac{0.5}{9s^2+3s+1}=\frac{1/18}{s^2+\frac13 s+\frac19}\]
<p>Se reconoce un segundo orden con \(\omega_n=\frac13\) y \(2\xi\omega_n=\frac13\Rightarrow\xi=0.5\). El valor final es \(T(0)=0.5\).</p></div>`},
{ id:'so', n:'Módulo 6', title:'Sistemas de segundo orden', short:'ωn, ξ, ωd, Tp, Mp, Ts y valor final directo de la función de transferencia.', practice:'so', html: String.raw`
<p>La forma estándar de un sistema de segundo orden es</p>
\[G(s)=\frac{K\,\omega_n^2}{s^2+2\xi\omega_n s+\omega_n^2}\]
<p>\(\omega_n\): frecuencia natural. \(\xi\): factor de amortiguamiento. \(K\): ganancia (valor final para escalón unitario).</p>
<h3>Paso a paso para sacar los parámetros</h3>
<ol class="method">
<li><b>Deja el coeficiente de \(s^2\) en 1</b>: divide arriba y abajo por él.</li>
<li>El término independiente es \(\omega_n^2\Rightarrow \omega_n=\sqrt{\text{término}}\).</li>
<li>El coeficiente de \(s\) es \(2\xi\omega_n\Rightarrow \xi=\dfrac{\text{coef. de } s}{2\omega_n}\).</li>
<li>Calcula \(\omega_d=\omega_n\sqrt{1-\xi^2}\) y \(\sigma=\xi\omega_n\) (con \(\tau=1/\sigma\)).</li>
<li>Aplica las fórmulas del certamen:
\[t_p=\frac{\pi}{\omega_d},\quad M_p=e^{-\frac{\xi\pi}{\sqrt{1-\xi^2}}},\quad t_{s(5\%)}=\frac{3}{\xi\omega_n},\quad t_{s(2\%)}=\frac{4}{\xi\omega_n}\]
\[t_r=\frac{\pi-\beta}{\omega_d},\quad \beta=\tan^{-1}\frac{\sqrt{1-\xi^2}}{\xi}\]</li>
<li><b>Valor final</b> para escalón unitario: \(G(0)=\dfrac{\text{numerador}}{\omega_n^2}\).</li>
</ol>
<h3>Clasificación por \(\xi\)</h3>
<div class="tbl"><table><thead><tr><th>\(\xi\)</th><th>Tipo</th><th>Raíces</th><th>Respuesta</th></tr></thead><tbody>
<tr><td>\(0\)</td><td>No amortiguado</td><td>Imaginarias puras</td><td>Oscila para siempre</td></tr>
<tr><td>\(0<\xi<1\)</td><td>Subamortiguado</td><td>Complejas conjugadas</td><td>Sobrepaso y oscilación que se apaga</td></tr>
<tr><td>\(1\)</td><td>Críticamente amortiguado</td><td>Reales iguales</td><td>La más rápida sin sobrepaso</td></tr>
<tr><td>\(>1\)</td><td>Sobreamortiguado</td><td>Reales distintas</td><td>Lenta, sin sobrepaso</td></tr>
</tbody></table></div>
<h3>Respuesta subamortiguada al escalón (fórmula cerrada)</h3>
\[c(t)=K\left[1-e^{-\sigma t}\left(\cos\omega_d t+\frac{\sigma}{\omega_d}\sin\omega_d t\right)\right]\]
<p class="muted small">Es exactamente lo que sale por fracciones parciales. Sirve para verificar tu desarrollo en segundos.</p>`},

const TRACKS = [
  { id: 'tr1', n: 'Polo Dominante', bpm: 92, root: 110, sc: [0, 3, 5, 7, 10], price: 150, seed: 3, col: '#ff6b4a' },
  { id: 'tr2', n: 'Lazo Cerrado Lo-fi', bpm: 78, root: 98, sc: [0, 2, 3, 7, 9], price: 250, seed: 11, col: '#9b8cff' },
  { id: 'tr3', n: 'Subamortiguado Groove', bpm: 110, root: 130.8, sc: [0, 2, 4, 7, 9], price: 350, seed: 5, col: '#3ddc97' },
  { id: 'tr4', n: 'Escalón Unitario', bpm: 128, root: 87.3, sc: [0, 3, 5, 6, 7, 10], price: 450, seed: 21, col: '#ffd166' },
  { id: 'tr5', n: 'Plano s Nocturno', bpm: 70, root: 82.4, sc: [0, 2, 3, 5, 7, 8, 10], price: 600, seed: 8, col: '#4cc9f0' },
  { id: 'tr6', n: 'Laplace Supremo', bpm: 140, root: 116.5, sc: [0, 4, 7, 11, 14], price: 900, seed: 42, col: '#ff4fd8' },
];
const Juke = (() => {
  let src = null, playing = null, bufs = {};
  function synth(c, tr, dur) {
    let seed = tr.seed; const r = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
    const beat = 60 / tr.bpm, bars = Math.floor(dur / (beat * 4)); const out = c.createGain(); out.gain.value = 0.5; out.connect(c.destination);
    const n2f = (i, oct = 0) => tr.root * Math.pow(2, (tr.sc[((i % tr.sc.length) + tr.sc.length) % tr.sc.length] + 12 * (Math.floor(i / tr.sc.length) + oct)) / 12);
    const note = (f, t, d, type, g) => { const o = c.createOscillator(), v = c.createGain(); o.type = type; o.frequency.value = f; v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(g, t + 0.01); v.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(v).connect(out); o.start(t); o.stop(t + d + 0.05); };
    const nb = c.createBuffer(1, c.sampleRate * 0.2, c.sampleRate); const nd = nb.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = (Math.random() * 2 - 1) * (1 - i / nd.length);
    const hat = (t, g) => { const s = c.createBufferSource(); s.buffer = nb; const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000; const v = c.createGain(); v.gain.value = g; s.connect(f).connect(v).connect(out); s.start(t); s.stop(t + 0.06); };
    const kick = (t) => { const o = c.createOscillator(), v = c.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.15); v.gain.setValueAtTime(0.9, t); v.gain.exponentialRampToValueAtTime(0.001, t + 0.3); o.connect(v).connect(out); o.start(t); o.stop(t + 0.32); };
    const prog = [0, 3, 4, 2].map(x => (x + Math.floor(r() * 2)) % tr.sc.length);
    const motif = Array.from({ length: 8 }, () => Math.floor(r() * tr.sc.length * 2));
    for (let b = 0; b < bars; b++) {
      const t0 = b * beat * 4, ch = prog[b % 4];
      [0, 2, 4].forEach(k => note(n2f(ch + k, 1), t0, beat * 4, 'triangle', 0.035));
      for (let q = 0; q < 4; q++) { const t = t0 + q * beat; if (q % 2 === 0 || tr.bpm > 120) kick(t); note(n2f(ch, 0) / 2, t, beat * 0.9, 'sawtooth', 0.05); hat(t + beat / 2, 0.08); }
      if (b >= 2) for (let e = 0; e < 8; e++) { if (r() < 0.3) continue; note(n2f(motif[(e + b) % 8] + ch, 2), t0 + e * beat / 2, beat * 0.45, 'square', 0.025); }
    }
  }
  async function buffer(tr) {
    if (bufs[tr.id]) return bufs[tr.id];
    const beat = 60 / tr.bpm, dur = beat * 4 * 16; const sr = 22050;
    const oc = new OfflineAudioContext(1, Math.ceil(sr * dur), sr); synth(oc, tr, dur);
    return (bufs[tr.id] = await oc.startRendering());
  }
  return {
    playing: () => playing,
    async play(tr) {
      this.stop(); MyMusic.stop(); const c = SFX.ac(); if (!c) return; const b = await buffer(tr);
      src = c.createBufferSource(); src.buffer = b; src.loop = true; const g = c.createGain(); g.gain.value = 0.6; src.connect(g).connect(c.destination); src.start(); playing = tr.id;
    },
    stop() { try { src?.stop(); } catch (e) { } src = null; playing = null; },
    async record(tr) { // graba una vuelta completa a .webm
      const c = SFX.ac(); const b = await buffer(tr); const dst = c.createMediaStreamDestination();
      const s = c.createBufferSource(); s.buffer = b; s.connect(dst);
      const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
      const rec = new MediaRecorder(dst.stream, { mimeType: mime }); const chunks = [];
      rec.ondataavailable = e => e.data.size && chunks.push(e.data);
      const done = new Promise(res => rec.onstop = res);
      rec.start(); s.start(); await new Promise(r => setTimeout(r, b.duration * 1000 + 300)); rec.stop(); await done;
      return new Blob(chunks, { type: 'audio/webm' });
    },
    dur(tr) { return Math.round(60 / tr.bpm * 64); }
  };
})();


// ===== Base local del navegador (IndexedDB): música y álbum propio =====
const IDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => { try { const r = indexedDB.open('laplace-rush-music', 2); r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('songs')) d.createObjectStore('songs', { keyPath: 'id' }); if (!d.objectStoreNames.contains('imgs')) d.createObjectStore('imgs', { keyPath: 'id' }); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }));
  const tx = async (store, mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction(store, mode); const out = fn(t.objectStore(store)); t.oncomplete = () => res(out?.result); t.onerror = () => rej(t.error); }); };
  return { tx };
})();
const getCard = (id) => CARD[id] || null;
// ===== Música propia del usuario (IndexedDB local, nunca sale del dispositivo) =====
const MyMusic = (() => {
  let audio = null, cur = null;
  const tx = (mode, fn) => IDB.tx('songs', mode, fn);
  return {
    async all() { try { return (await tx('readonly', st => st.getAll())) || []; } catch (e) { return MyMusic._mem || (MyMusic._mem = []); } },
    async add(f) { const row = { id: Date.now() + '-' + Math.random().toString(36).slice(2, 6), name: f.name.replace(/\.[^.]+$/, ''), blob: f }; try { await tx('readwrite', st => st.put(row)); } catch (e) { (MyMusic._mem = MyMusic._mem || []).push(row); } },
    async del(id) { if (cur === id) this.stop(); try { await tx('readwrite', st => st.delete(id)); } catch (e) { MyMusic._mem = (MyMusic._mem || []).filter(r => r.id !== id); } },
    play(row) { this.stop(); Juke.stop(); audio = new Audio(URL.createObjectURL(row.blob)); audio.loop = true; audio.volume = 0.7; audio.play().catch(() => { }); cur = row.id; },
    stop() { if (audio) { audio.pause(); URL.revokeObjectURL(audio.src); } audio = null; cur = null; },
    playing: () => cur,
  };
})();

    const ov = $('#ov'); ov.hidden = false; ov.innerHTML = '';
    let mode = 'login';
    const box = h('<div class="box auth"><span class="tag gold">Laplace Rush</span><h2 style="font-size:24px">Entra para competir</h2><p class="small muted">Solo usuario y contraseña. No pedimos correo.</p><div class="seg" style="justify-content:center"><button aria-pressed="true">Entrar</button><button aria-pressed="false">Crear cuenta</button></div><form class="card" style="width:100%;display:flex;flex-direction:column;gap:10px;text-align:left"><label class="f">Usuario<input class="txt" name="u" autocomplete="username" maxlength="20" required placeholder="ej: rey_del_plano"></label><label class="f">Contraseña<input class="txt" name="p" type="password" autocomplete="current-password" minlength="6" required placeholder="mínimo 6 caracteres"></label><label class="f" hidden>Repite la contraseña<input class="txt" name="p2" type="password" autocomplete="new-password" minlength="6"></label><p class="small bad-t" id="autherr"></p><button class="btn primary" type="submit">Entrar</button></form><button class="btn ghost sm" id="authguest">Seguir sin cuenta</button><p class="small muted">Si olvidas la contraseña no se puede recuperar, porque no hay correo asociado. Anótala.</p></div>');
    const form = $('form', box), err = $('#autherr', box), segs = $$('.seg button', box);
    const setMode = (m) => { mode = m; segs[0].setAttribute('aria-pressed', String(m === 'login')); segs[1].setAttribute('aria-pressed', String(m === 'signup')); form.p2.closest('label').hidden = m === 'login'; form.p2.required = m === 'signup'; form.p.autocomplete = m === 'login' ? 'current-password' : 'new-password'; $('button[type=submit]', form).textContent = m === 'login' ? 'Entrar' : 'Crear cuenta'; err.textContent = ''; };
    segs[0].onclick = () => setMode('login'); segs[1].onclick = () => setMode('signup');
    $('#authguest', box).onclick = () => { S.guest = true; save(); ov.hidden = true; ov.innerHTML = ''; this.refresh(); };
    form.onsubmit = async (e) => {
      e.preventDefault(); err.textContent = '';
      const u = form.u.value.trim(), p = form.p.value;
      if (!/^[A-Za-z0-9_.-]{3,20}$/.test(u)) { err.textContent = 'El usuario debe tener de 3 a 20 caracteres: letras, números, punto, guion o guion bajo.'; return; }
      if (p.length < 6) { err.textContent = 'La contraseña debe tener al menos 6 caracteres.'; return; }
      if (mode === 'signup' && p !== form.p2.value) { err.textContent = 'Las contraseñas no coinciden.'; return; }
      const sbt = $('button[type=submit]', form); sbt.disabled = true; sbt.textContent = 'Un momento…';
      try {
        const r = mode === 'login'
          ? await this.sb.auth.signInWithPassword({ email: this.email(u), password: p })
          : await this.sb.auth.signUp({ email: this.email(u), password: p, options: { data: { username: u } } });
        if (r.error) throw r.error;
        if (!r.data.session) throw new Error('confirm');
        S.guest = false; await this.setUser(r.data.user); ov.hidden = true; ov.innerHTML = '';
        toast(mode === 'login' ? '¡Hola de nuevo!' : '¡Cuenta creada!', u, '✓'); SFX.ach();
      } catch (ex) {
        const m = String(ex?.message || '');
        err.textContent = /Invalid login/i.test(m) ? 'Usuario o contraseña incorrectos.' : /already registered|already exists/i.test(m) ? 'Ese usuario ya existe. Elige otro.' : m === 'confirm' ? 'La cuenta quedó esperando confirmación por correo. El administrador debe desactivar "Confirm email" en Supabase.' : /rate limit/i.test(m) ? 'Demasiados intentos. Espera un minuto.' : /database error/i.test(m) ? 'El servidor no pudo crear el perfil. Revisa que supabase.sql se haya ejecutado completo.' : /email.*invalid|invalid.*email/i.test(m) ? 'El servidor rechazó el usuario interno.' : 'No se pudo conectar. Intenta de nuevo.';
        err.textContent += ' (Detalle: ' + (ex?.code ? ex.code + ' · ' : '') + (m || 'sin mensaje') + ')'; console.error(ex);
        sbt.disabled = false; sbt.textContent = mode === 'login' ? 'Entrar' : 'Crear cuenta';
      }
    };
    ov.append(box); setTimeout(() => form.u.focus(), 50);
  },
  async loadBoard() {
    if (!this.sb) return;
    const { data, error } = await this.sb.from('profiles').select('id,username,xp,lv,cards,streak,exam').order('xp', { ascending: false }).limit(100);
    this.board = error ? null : data; this.renderRank();
  },
  async push(force) {
    if (this.mode !== 'online' || !this.user || this.pushing) return;
    const row = { xp: S.xp, lv: levelOf(S.xp).lv, cards: Object.keys(S.cards).length, streak: S.bestStreak, exam: S.bestExam || 0 };
    const sig = JSON.stringify(row); if (!force && sig === this.lastPushed) return;
    this.pushing = true;
    try {
      const a = await this.sb.from('profiles').update({ ...row, updated_at: new Date().toISOString() }).eq('id', this.user.id);
      const b = await this.sb.from('progress').upsert({ id: this.user.id, save: JSON.parse(JSON.stringify(S)), updated_at: new Date().toISOString() });
      if (!a.error && !b.error) this.lastPushed = sig;
    } catch (e) { }
    this.pushing = false; if (VIEW === 'rank') this.loadBoard();
  },
  joinLobby() {
    try {
      this.ch = this.sb.channel('lobby', { config: { presence: { key: Math.random().toString(36).slice(2) } } });
      this.ch.on('presence', { event: 'sync' }, () => { const st = this.ch.presenceState(); this.peers = Object.entries(st).map(([k, v]) => ({ me: k === this.ch.params?.config?.presence?.key, ...(v[0] || {}) })); this.renderOnline(); });
      this.ch.on('broadcast', { event: 'hype' }, ({ payload }) => { const a = String(payload?.a || 'Alguien').slice(0, 20), t = String(payload?.t || '').slice(0, 80); if (!t) return; hypeLog.unshift(a + ' ' + t); hypeLog = hypeLog.slice(0, 5); this.renderOnline(); toast(a, t, '!'); });
      this.ch.subscribe((s) => { if (s === 'SUBSCRIBED') this.presence(); });
    } catch (e) { }
  },
  presence() { try { this.ch?.track({ alias: (S.alias || 'Invitado').slice(0, 20), lv: levelOf(S.xp).lv }); } catch (e) { } },
  hype(t) { if (this.mode !== 'online') return; try { this.ch?.send({ type: 'broadcast', event: 'hype', payload: { a: this.uname.slice(0, 20), t } }); hypeLog.unshift('Tú ' + t); hypeLog = hypeLog.slice(0, 5); this.renderOnline(); } catch (e) { } },
  renderOnline() {
    const el = $('#online'); if (!el) return;
    if (!this.ch) el.textContent = 'La presencia en vivo no está disponible.';
    else { el.innerHTML = ''; const myKey = this.ch.params?.config?.presence?.key; const ps = this.peers; if (ps.length <= 1) el.textContent = 'Solo tú por ahora.'; ps.forEach(p => { const c = h('<span class="chip"></span>'); c.textContent = (p.me ? 'Tú' : String(p.alias || 'Invitado').slice(0, 20)) + ' · Nv ' + (Number(p.lv) || 1); el.append(c); }); }
    const hy = $('#hype'); if (hy) { hy.innerHTML = ''; hypeLog.forEach(x => { const d = h('<div class="muted"></div>'); d.textContent = x; hy.append(d); }); }
  },
  renderRank() {
    const el = $('#ranklist'); if (!el) return; el.innerHTML = '';
    if (this.mode === 'loading') { el.append(h('<p class="muted small">Cargando ranking…</p>')); return; }
    if (!this.sb || this.board === null) el.append(h('<div class="card flat small muted">No se pudo cargar el ranking.</div>'));
    const rows = this.board || [];
    if (this.sb && this.board && !rows.length) el.append(h('<div class="card flat small muted">Nadie ha subido su puntaje todavía. Sé el primero.</div>'));
    rows.forEach((r, i) => {
      const me = r.id === this.user?.id;
      const d = h('<div class="rk' + (me ? ' me' : '') + '"><span class="pos ' + (i < 3 ? 'p' + (i + 1) : '') + '">' + (i + 1) + '</span><div class="nm"></div><span class="xp">' + (Number(r.xp) || 0) + ' XP</span></div>');
      $('.nm', d).textContent = String(r.username || 'Anónimo').slice(0, 20) + (me ? ' (tú)' : '');
      $('.nm', d).append(h('<div class="sub">Nivel ' + (Number(r.lv) || 1) + ' · ' + (Number(r.cards) || 0) + ' cartas · racha ' + (Number(r.streak) || 0) + (Number(r.exam) ? ' · simulacro ' + fmt(Number(r.exam), 1) : '') + '</div>'));
      el.append(d);
    });
    if (this.mode !== 'online') { const mine = h('<div class="rk me"><span class="pos">—</span><div class="nm"></div><span class="xp">' + S.xp + ' XP</span></div>'); $('.nm', mine).textContent = 'Tú (sin cuenta, no compites)'; el.append(mine); }
  },
};

// ===== Arranque =====
if (MIGR) { save(); setTimeout(() => toast('Cartas antiguas canjeadas', 'Tus cartas de fórmulas se cambiaron por ' + MIGR + ' monedas. Ahora el álbum son ' + CARDS.length + ' monas.', '$', 'toast-ach'), 1200); }
dailyInit(); hud(); IDB.tx('imgs', 'readwrite', st => st.clear()).catch(() => { }); renderHome();
NET.init();
addEventListener('pointerdown', () => SFX.ac(), { once: true });
document.addEventListener('visibilitychange', () => { if (document.hidden) { NET.push(); } });

</script>
</body>
</html>
